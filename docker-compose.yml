services:
  postgres:
    image: postgres:16-alpine
    container_name: gpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpt
      POSTGRES_PASSWORD: gpt
      POSTGRES_DB: gamepricetracker
    ports:
      - '5432:5432'
    volumes:
      - gpt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gpt -d gamepricetracker']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gpt_pgdata:
